      <rect x="1" y="1" width="4" height="110" rx="2" fill="#3FB950" opacity="0.75"/>
      <text x="119" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#3FB950">40+</text>
      <text x="119" y="83" text-anchor="middle" font-size="10.5" fill="#8B949E" letter-spacing="1.8">CASES INVESTIGATED</text>
    </g>

    <g transform="translate(254,0)">
      <rect width="238" height="112" rx="12" fill="url(#tile)" stroke="#21262D" stroke-width="2"/>
