      <text x="119" y="58" text-anchor="middle" font-size="38" font-weight="700" fill="#E6EDF3">9</text>
      <text x="119" y="83" text-anchor="middle" font-size="10.5" fill="#8B949E" letter-spacing="1.8">UPSTREAM PRs</text>
    </g>

    <g transform="translate(508,0)">
      <rect width="238" height="112" rx="12" fill="url(#tile)" stroke="#21262D" stroke-width="2"/>
